<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | Tobiroz</title>

    <!-- Fuentes (Asegurándonos de que las carga) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <style>
        /* Variables locales (por si no carga tu style.css principal) */
        :root {
            --bg-primary: #0F0E0C;
            --text-primary: #EDEAE5;
            --text-secondary: #918B82;
            --primary-light: #F08155;
            --border: #2A2724;
            --font-main: 'Inter', sans-serif;
            --font-serif: 'Fraunces', serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius-sm: 4px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px 24px;
            overflow: hidden;
        }

        /* Header mínimo */
        .mini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .mini-header a {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .mini-header a:hover {
            color: var(--primary-light);
        }

        /* Contenido principal del error */
        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 1160px;
            width: 100%;
            margin: 0 auto;
        }

        .error-code {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--primary-light);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .error-code::before {
            content: "";
            width: 24px;
            height: 1px;
            background: var(--primary-light);
        }

        .error-title {
            font-family: var(--font-serif);
            font-size: clamp(3rem, 12vw, 9rem); /* Enorme */
            font-weight: 400;
            line-height: 0.95;
            letter-spacing: -0.04em;
            margin-bottom: 32px;
            max-width: 900px;
        }

        .error-title .accent {
            font-style: italic;
            color: var(--text-secondary);
        }

        .error-desc {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 520px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .error-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-light);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background-color: var(--text-primary);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border-color: var(--border);
        }

        .btn-outline:hover {
            border-color: var(--text-secondary);
        }

        /* Footer mínimo */
        .mini-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            padding-top: 16px;
            opacity: 0.6;
        }

        /* Animación de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-code, .error-title, .error-desc, .error-actions {
            opacity: 0;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .error-code { animation-delay: 0.1s; }
        .error-title { animation-delay: 0.2s; }
        .error-desc { animation-delay: 0.3s; }
        .error-actions { animation-delay: 0.4s; }

    </style>
</head>
<body>

    <header class="mini-header">
        <span>tobiroz@web:~$</span>
        <a href="/">Volver al inicio</a>
    </header>

    <main class="error-container">
        <div class="error-code">ERROR 404 // NOT_FOUND</div>
        
        <h1 class="error-title">
            Esta página <span class="accent">no</span> existe
        </h1>
        
        <p class="error-desc">
            La URL que intentas buscar no existe, fue movida, o nunca formó parte de este servidor. 
            Pero no te preocupes, puedes volver a terreno seguro.
        </p>
        
        <div class="error-actions">
            <a href="/" class="btn btn-primary">Ir al Inicio</a>
            <a href="/#contact" class="btn btn-outline">Reportar un problema</a>
        </div>
    </main>

    <footer class="mini-footer">
        <span>STATUS: 404</span>
        <span>tobiroz.com</span>
    </footer>

</body>
</html>
