<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página no encontrada</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a73e8, #161616);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 40px;
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #ffa100;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #dddddd;
    }

    a {
      text-decoration: none;
      background: #0066cc;
      color: #ffffff;
      padding: 15px 30px;
      border-radius: 5px;
      font-size: 1rem;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    a:hover {
      background: #005bb5;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }

      a {
        font-size: 0.9rem;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404 - Página no encontrada</h1>
    <p>Lo sentimos, la página que estás buscando no existe. Verifica la URL o regresa a la página principal.</p>
    <a href="https://tobiroz.com/">Volver al inicio</a>
  </div>
</body>
</html>
